<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub | Business Support &amp; Commercial Operations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Todos os BIs do administrativo e assistência comercial em um só acesso.">
<link rel="icon" type="image/png" href="assets/img/marca/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="topo">
  <div class="wrap">
    <a class="marca" href="#inicio" aria-label="Business Support &amp; Commercial Operations, início">
      <img src="assets/img/marca/adm-logo.png" alt="ADM">
      <span class="div"></span><span class="marca-txt">Hub<span class="div"></span><b>Business Support &amp; Commercial Operations</b></span>
    </a>
    <nav class="nav" id="nav" aria-label="Frentes"></nav>
  </div>
</header>

<main id="inicio">
  <section class="abertura">
    <div class="wrap">
      <div class="abertura-texto">
        <h1>
          <span class="linha"><span>Todos os BIs do</span></span>
          <span class="linha"><span><em>administrativo e</em></span></span>
          <span class="linha"><span><em>assistência comercial</em></span></span>
          <span class="linha"><span>em um só acesso.</span></span>
        </h1>
        <p class="acesso">
          <svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="2.5" y="6" width="9" height="6.5" rx="1" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 6V4.5a2.5 2.5 0 015 0V6" stroke="currentColor" stroke-width="1.3"/></svg>
          Acesso com login corporativo ADM.
        </p>
        <ul class="indice" id="indice"></ul>
      </div>
      <div class="pilulas" aria-hidden="true">
        <div class="pilula"><img src="assets/img/fotos/pilula-silos.webp" alt="" data-vel="0.04"></div>
        <div class="pilula"><img src="assets/img/fotos/pilula-carregamento.webp" alt="" data-vel="0.07"></div>
        <div class="pilula"><img src="assets/img/fotos/pilula-navio.webp" alt="" data-vel="0.1"></div>
      </div>
    </div>
  </section>

  <div class="faixa" role="presentation"></div>

  <div id="frentes"></div>
</main>

<footer class="rodape">
  <div class="faixa" role="presentation"></div>
  <div class="wrap">
    <div class="rodape-grade">
      <div class="contato">
        <p class="rotulo">Dúvidas sobre os BIs</p>
        <p class="email" id="email"></p>
        <button class="copiar" id="copiar" type="button">Copiar e-mail</button>
      </div>
    </div>
    <div class="rodape-base">
      <img src="assets/img/marca/adm-logo-branco.png" alt="ADM">
      <span>Business Support &amp; Commercial Operations · Developed by CTRM · <span id="ano"></span></span>
    </div>
  </div>
</footer>

<script src="assets/js/bis.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
